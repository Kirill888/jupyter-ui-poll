name: build

on:
  pull_request:
    paths:
      - "**"

  push:
    paths:
      - "**"
      - "!notebooks/**"
      - "!scripts/**"
      - "!binder/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flit twine

      - name: Lint with flake8
        run: |
          pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Packaging (flit)
        run: |
          flit build
          find dist -name "*whl" -exec unzip -l '{}' \;

      - name: Check Distribution Files
        run: |
          flit --version
          twine --version
          twine check dist/*

      - name: Publish (test pypi)
        if: |
          github.event_name == 'push' && (
            github.ref == 'refs/heads/develop'
            || github.ref == 'refs/heads/prep-release'
          )

        run: |
          twine upload --verbose --disable-progress-bar --skip-existing dist/* || true

        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.test_pypi_token }}
          TWINE_REPOSITORY_URL: "https://test.pypi.org/legacy/"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ipykernel: ["6.30.1", "7.0.1", "7.1.0", "7.4.0"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest jupyter_client ipywidgets "ipykernel==${{ matrix.ipykernel }}"

      - name: Test against a real kernel
        run: pytest -v tests
