[build-system]
requires = ["flit_core>=3.9"]
build-backend = "flit_core.buildapi"

[project]
name = "jupyter-ui-poll"
version = "1.1.0"
description = "Block jupyter cell execution while interacting with widgets"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Kirill Kouzoubov", email = "kirill888@gmail.com" }
]
keywords = ["jupyter", "ipywidgets"]
classifiers = [
  "Framework :: Jupyter",
  "Intended Audience :: Developers",
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "ipython"
]

[project.optional-dependencies]
dev = ["wheel", "jupyter"]
docs = ["sphinx", "sphinx-autodoc-typehints", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/kirill888/jupyter-ui-poll"
Documentation = "https://jupyter-ui-poll.readthedocs.io/en/latest/"
"Bug Reporting" = "https://github.com/kirill888/jupyter-ui-poll/issues"

[tool.flit.module]
name = "jupyter_ui_poll"

[tool.flit.sdist]
exclude = [
  "binder/",
  "notebooks/",
  "scripts/",
  ".github/",
  ".readthedocs.yaml"
]

[tool.flake8]
max-line-length = 99
doctests = true
exclude = [
  ".git",
  ".eggs",
  "__pycache__",
  "tests/",
  "docs/",
  "build/",
  "dist/"
]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
allow_redefinition = true
